name: microCMS to Astro Deployment

on:
  repository_dispatch:
    types: [microcms-webhook]
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
  push:                      # ← v3で追加
    branches:
      - main
      - staging

# ✅ Git push権限（項番4で設定済み）
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # [skip ci] が含まれていたらスキップ（無限ループ防止）
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    env:
      TZ: 'Asia/Tokyo'
    
    steps:
      # ===== 既存のビルド・デプロイステップ =====
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch content from microCMS
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: |
          node scripts/fetch-microcms.js

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/
          git diff --staged --quiet || git commit -m "chore: update content from microCMS [skip ci]"
          git push

      # ===== v3: Cloudflare Pages へのデプロイは Git 連携で自動実行 =====
      # Build は不要（Cloudflare Pages 側で自動ビルド）
      # ただし、ローカルでビルドを確認したい場合は以下を有効化:
      # - name: Build Astro site (Optional)
      #   run: npm run build
      #   env:
      #     MODE: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

        if: github.event_name == 'repository_dispatch'
        run: |
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ===== ✅ Slack 通知ステップ(成功時) =====
      - name: Notify Slack on Success
        if: success()
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          ACTOR="${GITHUB_ACTOR}"
          
          if [ "$BRANCH_NAME" = "main" ]; then
            WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL_PROD }}"
            ENV_NAME="Production"
            SITE_URL="https://example.com"
          else
            WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL_STAGING }}"
            ENV_NAME="Staging"
            SITE_URL="https://staging.example.com"
          fi

          # v3: トリガータイプを判定
          TRIGGER_TYPE=""
          case "${{ github.event_name }}" in
            "push")
              TRIGGER_TYPE="🔧 Code Push"
              ;;
            "repository_dispatch")
              TRIGGER_TYPE="📝 microCMS Webhook"
              ;;
            "schedule")
              TRIGGER_TYPE="⏰ Scheduled Sync"
              ;;
            "workflow_dispatch")
              TRIGGER_TYPE="👤 Manual Execution"
              ;;
          esac

          # SNS投稿結果を取得
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
          fi

          curl -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "✅ '"$ENV_NAME"' デプロイ成功",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ '"$ENV_NAME"' デプロイ成功"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*ブランチ:*'"$BRANCH_NAME"'"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*トリガー:*'"$TRIGGER_TYPE"'"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*コミット:*`'"$COMMIT_SHA"'`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*実行者:*@'"$ACTOR"'"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*サイト URL:*<'"$SITE_URL"'|'"$SITE_URL"'>"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*コミットメッセージ:*'"$COMMIT_MSG"''"$SNS_STATUS"'"
                  }
                }
              ]
            }'

      # ===== ❌ Slack 通知ステップ(失敗時) =====
      - name: Notify Slack on Failure
        if: failure()
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          ACTOR="${GITHUB_ACTOR}"
          
          if [ "$BRANCH_NAME" = "main" ]; then
            WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL_PROD }}"
            ENV_NAME="Production"
          else
            WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL_STAGING }}"
            ENV_NAME="Staging"
          fi

          # v3: トリガータイプを判定
          TRIGGER_TYPE=""
          case "${{ github.event_name }}" in
            "push")
              TRIGGER_TYPE="🔧 Code Push"
              ;;
            "repository_dispatch")
              TRIGGER_TYPE="📝 microCMS Webhook"
              ;;
            "schedule")
              TRIGGER_TYPE="⏰ Scheduled Sync"
              ;;
            "workflow_dispatch")
              TRIGGER_TYPE="👤 Manual Execution"
              ;;
          esac

          curl -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "❌ '"$ENV_NAME"' デプロイ失敗",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ '"$ENV_NAME"' デプロイ失敗"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*ブランチ:*'"$BRANCH_NAME"'"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*トリガー:*'"$TRIGGER_TYPE"'"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*コミット:*`'"$COMMIT_SHA"'`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*実行者:*@'"$ACTOR"'"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*ログ:*<'"$GITHUB_SERVER_URL"'/'"$GITHUB_REPOSITORY"'/actions/runs/'"$GITHUB_RUN_ID"'|GitHub Actions ログを確認>"
                    }
                  ]
                }
              ]
            }'
