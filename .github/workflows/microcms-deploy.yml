name: microCMS to Astro Deployment

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
  push:                      # ← v3で追加
    branches:
      - main
      - staging

# ✅ Git push権限（項番4で設定済み）
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # [skip ci] が含まれていたらスキップ（無限ループ防止）
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    env:
      TZ: 'Asia/Tokyo'
    
    steps:
      # ===== 既存のビルド・デプロイステップ =====
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch content from microCMS
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: |
          node scripts/fetch-microcms.js

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/
          git diff --staged --quiet || git commit -m "chore: update content from microCMS [skip ci]"
          git push

